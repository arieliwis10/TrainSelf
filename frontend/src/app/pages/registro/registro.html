<div class="container">
  <div class="card">
    <h2>TrainSelf</h2>
    <p class="subtitle">Crea tu cuenta</p>

    <div class="form-group">
      <label>Nombre</label>
      <input type="text" [(ngModel)]="nombre" placeholder="Tu nombre"/>
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" [(ngModel)]="email" placeholder="tu@email.com"/>
    </div>

    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" [(ngModel)]="password" placeholder="••••••••"/>
    </div>

    <p class="error" *ngIf="error">{{ error }}</p>
    <p class="success" *ngIf="success">{{ success }}</p>

    <button (click)="registrar()">Crear cuenta</button>

    <p class="link">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
  </div>
</div>
