<div class="container">
  <div class="card">
    <h2>¿Cuál es tu objetivo hoy?</h2>
    <p class="subtitle">Elige el que mejor se adapte a ti</p>

    <div class="objetivo-list">
      <div
        *ngFor="let obj of objetivos"
        class="objetivo-item"
        [class.selected]="objetivoSeleccionado() === obj.nombre"
        (click)="seleccionarObjetivo(obj.nombre)"
      >
        <span class="icono">{{ obj.icono }}</span>
        <div class="texto">
          <strong>{{ obj.nombre }}</strong>
          <small>{{ obj.descripcion }}</small>
        </div>
      </div>
    </div>

    <p class="label">Nivel</p>
    <div class="nivel-group">
      <button
        *ngFor="let n of niveles"
        [class.active]="nivelSeleccionado() === n"
        (click)="seleccionarNivel(n)"
      >
        {{ n }}
      </button>
    </div>

    <p class="error" *ngIf="error()">{{ error() }}</p>

    <button class="continuar" (click)="buscarRutinas()" [disabled]="cargando()">
      {{ cargando() ? 'Buscando...' : 'Buscar rutinas' }}
    </button>

    <div class="volver-abajo" style="border-top: 1px solid #333; margin-top: 1.5rem; padding-top: 1rem;">
      <button (click)="cerrarSesion()" style="background:none; border:1px solid #333; border-radius:8px; color:#999; padding:0.5rem 1rem; cursor:pointer; width:100%;">
        Cerrar sesión
      </button>
    </div>

    <div class="resultados" *ngIf="buscado() && rutinasEncontradas().length > 0">
      <p class="label">Rutinas disponibles</p>
      <div
        class="rutina-item"
        *ngFor="let r of rutinasEncontradas()"
        (click)="elegirRutina(r.id)"
      >
        <div class="texto">
          <strong>{{ r.nombre }}</strong>
          <small>{{ r.duracionEstimadaMin }} min · {{ r.ejercicios.length }} ejercicios</small>
        </div>
        <span class="flecha">›</span>
      </div>
    </div>
  </div>
</div>
