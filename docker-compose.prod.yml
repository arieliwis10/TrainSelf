services:

  ms-auth:
    image: ${DOCKERHUB_USER}/trainself-ms-auth:latest
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - SPRING_PROFILES_ACTIVE=oracle
      - ORACLE_DB_SERVICE=${ORACLE_DB_SERVICE}
      - ORACLE_DB_USER=${ORACLE_DB_USER}
      - ORACLE_DB_PASSWORD=${ORACLE_DB_PASSWORD}
    volumes:
      - ./wallet:/app/wallet:ro
    restart: always
    networks:
      - trainself-net

  ms-usuarios:
    image: ${DOCKERHUB_USER}/trainself-ms-usuarios:latest
    environment:
      - SPRING_PROFILES_ACTIVE=oracle
      - ORACLE_DB_SERVICE=${ORACLE_DB_SERVICE}
      - ORACLE_DB_USER=${ORACLE_DB_USER}
      - ORACLE_DB_PASSWORD=${ORACLE_DB_PASSWORD}
    volumes:
      - ./wallet:/app/wallet:ro
    restart: always
    depends_on:
      - ms-auth
    networks:
      - trainself-net

  ms-rutinas:
    image: ${DOCKERHUB_USER}/trainself-ms-rutinas:latest
    environment:
      - SPRING_PROFILES_ACTIVE=oracle
      - ORACLE_DB_SERVICE=${ORACLE_DB_SERVICE}
      - ORACLE_DB_USER=${ORACLE_DB_USER}
      - ORACLE_DB_PASSWORD=${ORACLE_DB_PASSWORD}
    volumes:
      - ./wallet:/app/wallet:ro
    restart: always
    depends_on:
      - ms-auth
    networks:
      - trainself-net

  ms-admin:
    image: ${DOCKERHUB_USER}/trainself-ms-admin:latest
    environment:
      - SPRING_PROFILES_ACTIVE=oracle
      - ORACLE_DB_SERVICE=${ORACLE_DB_SERVICE}
      - ORACLE_DB_USER=${ORACLE_DB_USER}
      - ORACLE_DB_PASSWORD=${ORACLE_DB_PASSWORD}
    volumes:
      - ./wallet:/app/wallet:ro
    restart: always
    depends_on:
      - ms-auth
    networks:
      - trainself-net

  ms-leaderboard:
    image: ${DOCKERHUB_USER}/trainself-ms-leaderboard:latest
    environment:
      - SPRING_PROFILES_ACTIVE=oracle
      - ORACLE_DB_SERVICE=${ORACLE_DB_SERVICE}
      - ORACLE_DB_USER=${ORACLE_DB_USER}
      - ORACLE_DB_PASSWORD=${ORACLE_DB_PASSWORD}
    volumes:
      - ./wallet:/app/wallet:ro
    restart: always
    depends_on:
      - ms-auth
    networks:
      - trainself-net

  bff:
    image: ${DOCKERHUB_USER}/trainself-bff:latest
    ports:
      - "3000:3000"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - services.auth.url=http://ms-auth:8081
      - services.usuarios.url=http://ms-usuarios:8082
      - services.rutinas.url=http://ms-rutinas:8083
      - services.admin.url=http://ms-admin:8084
      - services.leaderboard.url=http://ms-leaderboard:8085
    restart: always
    depends_on:
      - ms-auth
      - ms-usuarios
      - ms-rutinas
      - ms-admin
      - ms-leaderboard
    networks:
      - trainself-net

  frontend:
    image: ${DOCKERHUB_USER}/trainself-frontend:latest
    ports:
      - "80:80"
    restart: always
    depends_on:
      - bff
    networks:
      - trainself-net

networks:
  trainself-net:
    driver: bridge